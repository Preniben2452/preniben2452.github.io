<text x="40" y="228" class="lab-s">by ammonia oxidising archaea</text>
<text x="488" y="118" class="lab">Marine snow polysaccharides</text>
<path class="ln2" marker-end="url(#ar2b)" d="M520 126 C500 160 470 200 430 222"/>
<text x="488" y="170" class="lab">Fumarate and vitamin B12</text>
<text x="488" y="186" class="lab-s">exchanged between archaeon,</text>
<text x="488" y="200" class="lab-s">bacterium and phage</text>
<text x="488" y="250" class="lab-s">Heterotrophic bacteria degrade</text>
<text x="488" y="264" class="lab-s">recalcitrant carbon</text>
</svg>