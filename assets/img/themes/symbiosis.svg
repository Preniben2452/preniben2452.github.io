<polygon class="f3" points="364,254 371,258 371,266 364,270 357,266 357,258"/>
<text x="40" y="118" class="lab">Host ammonia (NH₃)</text>
<path class="ln" marker-end="url(#ar2)" d="M168 114 C220 118 270 134 312 146"/>
<text x="40" y="168" class="lab">Dissolved CO₂</text>
