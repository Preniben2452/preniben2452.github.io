<path class="ln2" d="M170 182 C182 174 194 190 206 182 S230 174 242 182 S260 190 262 182"/>
<text x="215" y="270" text-anchor="middle" class="lab-s">Palm oil mill</text>
<text x="215" y="284" text-anchor="middle" class="lab-s">effluent (POME)</text>
