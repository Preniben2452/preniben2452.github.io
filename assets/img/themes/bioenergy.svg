<circle class="fb ln thin" cx="470" cy="232" r="4"/><circle class="fb ln thin" cx="522" cy="238" r="3"/><circle class="fb ln thin" cx="500" cy="222" r="3"/><circle class="fb ln thin" cx="540" cy="226" r="2.5"/>
<text x="500" y="270" text-anchor="middle" class="lab-s">Dark fermentation,</text>
<text x="500" y="284" text-anchor="middle" class="lab-s">mixed consortium</text>
